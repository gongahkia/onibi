# source: packages/policy/src/packs.ts
# source_git_sha: fb950a9b39ea55988b96fd9bae04e093e0524efd
# policy_pack_id: appsec-agent-baseline
# version: 1.0.0

[[rule]]
id = "appsec-agent-deny-destructive-shell"
tool = "Bash"
command_any = ["rm -rf", "sudo rm", "mkfs", "diskutil erase", "git reset --hard", "git clean -fd"]
action = "deny"

[[rule]]
id = "appsec-agent-deny-secret-exfil"
tool = "Bash"
command_any = ["curl", "wget", "nc", "scp"]
command_any_secondary = ["TOKEN", "SECRET", "PASSWORD", "PRIVATE_KEY", "API_KEY"]
action = "deny"

[[rule]]
id = "appsec-agent-deny-exploit-execution"
tool = "Bash"
command_any = ["msfconsole", "metasploit", "sqlmap", "hydra", "exploit", "reverse shell", "meterpreter", "payload"]
action = "deny"

[[rule]]
id = "appsec-agent-deny-persistence-lateral"
tool = "Bash"
command_any = ["persistence", "lateral movement", "pass-the-hash", "kerberoast", "mimikatz"]
action = "deny"

[[rule]]
id = "appsec-agent-review-active-scanner"
tool = "Bash"
command_any = ["nmap", "nuclei", "zap", "ffuf", "gobuster", "nikto", "burp", "dirsearch"]
action = "require-approval"
approver_role = "appsec-reviewer"

[[rule]]
id = "appsec-agent-review-container-run"
tool = "Bash"
command_any = ["docker run", "docker compose up", "docker exec"]
action = "require-approval"
approver_role = "appsec-reviewer"

[[rule]]
id = "appsec-agent-log-docker-build"
tool = "Bash"
command_any = ["docker build"]
action = "log-only"
