services:
  relay-init:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    user: "0:0"
    entrypoint: ["/usr/local/bin/arachne-relay"]
    command: ["generate-identity", "--output", "/runtime/relay-identity"]
    volumes:
      - relay-runtime:/runtime
    restart: "no"

  tls-init:
    image: alpine:3.21
    command:
      - /bin/sh
      - -ec
      - >-
        apk add --no-cache openssl &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 1
        -subj /CN=arachne-relay
        -keyout /runtime/relay.key -out /runtime/relay.pem &&
        chmod 0644 /runtime/relay.key /runtime/relay.pem
    volumes:
      - relay-runtime:/runtime
    restart: "no"

  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    command:
      - run
      - --config
      - /etc/arachne/relay.conf
      - --identity
      - /runtime/relay-identity
      - --tls-certificate
      - /runtime/relay.pem
      - --tls-private-key
      - /runtime/relay.key
    depends_on:
      relay-init:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    volumes:
      - ./relay.conf:/etc/arachne/relay.conf:ro
      - relay-runtime:/runtime:ro
      - relay-data:/var/lib/arachne

  tor-onion:
    image: alpine:3.21
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache tor && exec tor -f /etc/tor/torrc
    depends_on:
      relay:
        condition: service_started
    volumes:
      - ./torrc.onion:/etc/tor/torrc:ro
      - onion-state:/var/lib/tor

  tor-socks:
    image: alpine:3.21
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache tor && exec tor -f /etc/tor/torrc
    volumes:
      - ./torrc.socks:/etc/tor/torrc:ro
      - socks-state:/var/lib/tor
    ports:
      - "127.0.0.1:9050:9050"

volumes:
  relay-data:
  relay-runtime:
  onion-state:
  socks-state:
