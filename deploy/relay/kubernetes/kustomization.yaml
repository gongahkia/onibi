apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yeokcham-relay
resources:
  - namespace.yaml
  - service-account.yaml
  - service.yaml
  - stateful-set.yaml
  - pod-disruption-budget.yaml
  - network-policy.yaml
configMapGenerator:
  - name: yeokcham-relay-config
    files:
      - relay.conf=relay.conf
generatorOptions:
  immutable: true
images:
  - name: ghcr.io/gongahkia/yeokcham-relay
    newTag: "0.1.0"
