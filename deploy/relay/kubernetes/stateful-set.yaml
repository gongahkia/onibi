apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yeokcham-relay
  labels:
    app.kubernetes.io/component: relay
    app.kubernetes.io/name: yeokcham
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  serviceName: yeokcham-relay-headless
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/component: relay
      app.kubernetes.io/name: yeokcham
  template:
    metadata:
      labels:
        app.kubernetes.io/component: relay
        app.kubernetes.io/name: yeokcham
    spec:
      automountServiceAccountToken: false
      serviceAccountName: yeokcham-relay
      terminationGracePeriodSeconds: 35
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/gongahkia/yeokcham-relay:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --config
            - /etc/yeokcham/relay.conf
            - --identity
            - /run/secrets/relay.identity
            - --health-address
            - 127.0.0.1:8080
            - --metrics-address
            - 127.0.0.1:8081
            - --graceful-shutdown-timeout-seconds
            - "30"
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command:
                - /usr/local/bin/yeokcham-relay
                - healthcheck
                - --address
                - 127.0.0.1:8080
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/yeokcham-relay
                - healthcheck
                - --address
                - 127.0.0.1:8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/yeokcham-relay
                - healthcheck
                - --address
                - 127.0.0.1:8080
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /etc/yeokcham
              name: config
              readOnly: true
            - mountPath: /run/secrets
              name: relay-identity
              readOnly: true
            - mountPath: /var/lib/yeokcham
              name: data
      volumes:
        - configMap:
            name: yeokcham-relay-config
          name: config
        - name: relay-identity
          secret:
            defaultMode: 288
            items:
              - key: relay.identity
                path: relay.identity
            secretName: yeokcham-relay-identity
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/component: relay
          app.kubernetes.io/name: yeokcham
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
