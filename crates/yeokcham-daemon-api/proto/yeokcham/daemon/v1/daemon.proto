syntax = "proto3";

package yeokcham.daemon.v1;

service DaemonService {
  rpc StartClient(StartClientRequest) returns (StartClientResponse);
  rpc ShutdownDaemon(ShutdownDaemonRequest) returns (ShutdownDaemonResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (IdentityResponse);
  rpc GetIdentity(GetIdentityRequest) returns (IdentityResponse);
  rpc CreateOrLoadIdentity(CreateOrLoadIdentityRequest) returns (IdentityResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc ImportContactInvitation(ImportContactInvitationRequest) returns (ContactResponse);
  rpc VerifyContactQr(VerifyContactQrRequest) returns (ContactResponse);
  rpc VerifyContactSafetyNumber(VerifyContactSafetyNumberRequest) returns (ContactResponse);
  rpc ApplyContactIdentityRotation(ApplyContactIdentityRotationRequest) returns (ContactResponse);
  rpc RevokeContact(RevokeContactRequest) returns (ContactResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetDeliveryStatus(GetDeliveryStatusRequest) returns (GetDeliveryStatusResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message StartClientRequest {}

message StartClientResponse {
  uint32 api_major = 1;
  uint32 api_minor = 2;
  bool running = 3;
}

message ShutdownDaemonRequest {}

message ShutdownDaemonResponse {
  bool running = 1;
}

message CreateIdentityRequest {}

message GetIdentityRequest {}

message CreateOrLoadIdentityRequest {}

enum IdentityInitialization {
  IDENTITY_INITIALIZATION_UNSPECIFIED = 0;
  IDENTITY_INITIALIZATION_CREATED = 1;
  IDENTITY_INITIALIZATION_LOADED = 2;
}

message IdentityResponse {
  bytes public_key = 1;
  IdentityInitialization initialization = 2;
}

message ListContactsRequest {}

message ListContactsResponse {
  repeated ContactResponse contacts = 1;
}

message GetContactRequest {
  bytes identity = 1;
}

message GetContactResponse {
  ContactResponse contact = 1;
}

message ImportContactInvitationRequest {
  bytes invitation = 1;
}

message VerifyContactQrRequest {
  bytes payload = 1;
}

message VerifyContactSafetyNumberRequest {
  bytes identity = 1;
  bytes fingerprint = 2;
}

message ApplyContactIdentityRotationRequest {
  bytes rotation = 1;
}

message RevokeContactRequest {
  bytes identity = 1;
}

message SendMessageRequest {
  bytes recipient = 1;
  bytes envelope = 2;
  uint64 created_at = 3;
  uint32 ttl_seconds = 4;
}

message SendMessageResponse {
  bytes message_identifier = 1;
}

message GetDeliveryStatusRequest {
  bytes message_identifier = 1;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_QUEUED = 1;
  DELIVERY_STATUS_DELIVERED = 2;
  DELIVERY_STATUS_EXPIRED = 3;
  DELIVERY_STATUS_FAILED = 4;
}

message GetDeliveryStatusResponse {
  DeliveryStatus status = 1;
}

enum ContactStatus {
  CONTACT_STATUS_UNSPECIFIED = 0;
  CONTACT_STATUS_PENDING = 1;
  CONTACT_STATUS_VERIFIED = 2;
  CONTACT_STATUS_REVOKED = 3;
}

enum ContactVerificationMethod {
  CONTACT_VERIFICATION_METHOD_UNSPECIFIED = 0;
  CONTACT_VERIFICATION_METHOD_QR = 1;
  CONTACT_VERIFICATION_METHOD_SAFETY_NUMBER = 2;
}

message ContactResponse {
  bytes identity = 1;
  ContactStatus status = 2;
  ContactVerificationMethod verification_method = 3;
}

message GetStatusRequest {}

message GetStatusResponse {
  uint32 api_major = 1;
  uint32 api_minor = 2;
  bool running = 3;
}
