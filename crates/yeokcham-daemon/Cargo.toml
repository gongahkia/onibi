[package]
name = "yeokcham-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
experimental-relay-replication = ["yeokcham-protocol/experimental-relay-replication"]

[dependencies]
chacha20poly1305.workspace = true
fs2.workspace = true
getrandom.workspace = true
hyper-util.workspace = true
igd-next.workspace = true
minicbor.workspace = true
mdns-sd.workspace = true
natpmp.workspace = true
quinn.workspace = true
rcgen = "0.14.7"
rusqlite.workspace = true
sha2.workspace = true
stunclient.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-socks.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tower.workspace = true
tracing.workspace = true
yeokcham-core = { path = "../yeokcham-core" }
yeokcham-daemon-api = { path = "../yeokcham-daemon-api" }
yeokcham-protocol = { path = "../yeokcham-protocol" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Networking_Connectivity", "Networking_NetworkOperators", "Win32_Foundation", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
corebluetooth = "0.1.0"
corewlan = "0.2.1"

[dev-dependencies]
criterion.workspace = true
prost.workspace = true
proptest.workspace = true
tonic-prost.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "local_transport"
harness = false

[lints]
workspace = true
