version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: onibi-darwin
    main: ./cmd/onibi
    binary: onibi
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/gongahkia/onibi/internal/buildinfo.Version={{.Version}}
      - -X github.com/gongahkia/onibi/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/gongahkia/onibi/internal/buildinfo.Date={{.Date}}
  - id: onibi-linux
    main: ./cmd/onibi
    binary: onibi
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/gongahkia/onibi/internal/buildinfo.Version={{.Version}}
      - -X github.com/gongahkia/onibi/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/gongahkia/onibi/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    files: [LICENSE, SECURITY.md, THREAT-MODEL.md, THIRD_PARTY_NOTICES.md, third_party/rattles/LICENSE-MIT, third_party/fonts/*.txt, docs/web.md, docs/managed-sessions.md, docs/linux-wsl.md, docs/product-audit.md, docs/cockpit-review.md, docs/readiness-review.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: 0.1.0-dev
