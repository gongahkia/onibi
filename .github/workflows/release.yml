name: Release candidate

on:
  push:
    tags: ["v*"]

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0
      - name: bootstrap the documented local environment
        run: make bootstrap OCAML_COMPILER=ocaml-base-compiler.5.3.0
      - name: build release-profile binaries
        run: make release
      - name: package release archive
        run: make release-archive RELEASE_ARTIFACT_DIR=.
      - uses: actions/upload-artifact@v4
        with:
          name: zenbu-linux-x86_64
          path: zenbu-*-linux-x86_64.tar.gz
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: install runtime dependencies
        run: brew install lua@5.4 libffi
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0
      - name: bootstrap the documented local environment
        run: make bootstrap OCAML_COMPILER=ocaml-base-compiler.5.3.0
      - name: package release archive
        run: make release-archive RELEASE_ARTIFACT_DIR=.
      - uses: actions/upload-artifact@v4
        with:
          name: zenbu-darwin-arm64
          path: zenbu-*-darwin-arm64.tar.gz
