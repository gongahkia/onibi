name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/onibi ./cmd/onibi-dev
      - name: Source installation lifecycle (isolated prefixes, no native services)
        run: go test -count=1 -run TestSourceLifecycleIntegration -v ./internal/devtool
        env:
          ONIBI_SOURCE_SMOKE: "1"

  browser:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      ONIBI_BROWSER: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm test

  live-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONIBI_LIVE_MUX: tmux,zellij,screen
      ONIBI_LIVE_BROWSER: "1"
      ONIBI_LIVE_RACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Install real terminal backends
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux screen
          mux_download=$(mktemp -d)
          curl --fail --location --retry 3 https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz --output "$mux_download/zellij.tar.gz"
          printf '%s  %s\n' '40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc' "$mux_download/zellij.tar.gz" | sha256sum --check --status
          tar -xzf "$mux_download/zellij.tar.gz" -C "$mux_download" zellij
          sudo install -m 755 "$mux_download/zellij" /usr/local/bin/zellij
      - run: npm ci --prefix web-tests
      - run: npx playwright install --with-deps chromium
        working-directory: web-tests
      - name: Production CLI, HTTP, restart recovery and Chromium with real sessions
        run: make test-live

  release-snapshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

  vulnerability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
