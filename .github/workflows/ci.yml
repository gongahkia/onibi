name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0
      - name: bootstrap the documented local environment
        run: make bootstrap OCAML_COMPILER=ocaml-base-compiler.5.3.0
      - name: exercise headless demo
        run: make demo
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: install Lua 5.4
        run: brew install lua@5.4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0
      - name: bootstrap the documented local environment
        run: make bootstrap OCAML_COMPILER=ocaml-base-compiler.5.3.0
      - name: exercise headless demo
        run: make demo
