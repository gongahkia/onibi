name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Upload AppSec audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-audit-bundle
          path: .kelpclaw/appsec/**/audit-bundle
          if-no-files-found: warn

  pi:
    name: Pi Agent (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            packages/pi-agent/target
          key: ${{ runner.os }}-cargo-pi-${{ matrix.target }}-${{ hashFiles('packages/pi-agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pi-${{ matrix.target }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cross
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --locked
          fi

      - name: Build Pi agent
        run: cross build --manifest-path packages/pi-agent/Cargo.toml --target ${{ matrix.target }}

      - name: Install ARM64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Check Pi agent stripped size
        run: |
          binary="packages/pi-agent/target/${{ matrix.target }}/debug/kelp-pi-agent"
          stripped="${RUNNER_TEMP}/kelp-pi-agent-stripped"
          max_bytes=$((20 * 1024 * 1024))
          aarch64-linux-gnu-objcopy --strip-all "$binary" "$stripped"
          size_bytes=$(stat -c%s "$stripped")
          echo "stripped_size_bytes=${size_bytes}"
          test "$size_bytes" -le "$max_bytes"

      - name: Clippy Pi agent
        run: cross clippy --manifest-path packages/pi-agent/Cargo.toml --target ${{ matrix.target }} -- -D warnings

      - name: Test Pi agent
        run: cross test --manifest-path packages/pi-agent/Cargo.toml --target ${{ matrix.target }}
