name: KelpClaw AppSec Harness
description: Run AppSec audit, repository inventory, or legacy SKILL.md audit and export signed evidence.

inputs:
  mode:
    description: Run appsec, audit, or inventory.
    required: false
    default: appsec
  context:
    description: AppSec audit Docker build context.
    required: false
    default: .
  dockerfile:
    description: AppSec audit Dockerfile path relative to context.
    required: false
    default: Dockerfile
  agent-command:
    description: AppSec triage agent command.
    required: false
    default: ""
  sarif:
    description: Optional SARIF file to import during AppSec audit.
    required: false
    default: ""
  nuclei-jsonl:
    description: Optional Nuclei JSONL file to import during AppSec audit.
    required: false
    default: ""
  zap-json:
    description: Optional ZAP JSON file to import during AppSec audit.
    required: false
    default: ""
  nmap-xml:
    description: Optional Nmap XML file to import during AppSec audit.
    required: false
    default: ""
  burp-xml:
    description: Optional Burp XML file to import during AppSec audit.
    required: false
    default: ""
  nessus-xml:
    description: Optional Nessus XML file to import during AppSec audit.
    required: false
    default: ""
  skip-docker-build:
    description: Skip AppSec Docker build and import passive scanner evidence only.
    required: false
    default: "false"
  fail-on-qa:
    description: Fail AppSec mode when evidence QA reports errors.
    required: false
    default: "true"
  lab-mode:
    description: Mark the AppSec audit as opt-in local lab validation.
    required: false
    default: "false"
  skill:
    description: Path to the SKILL.md to audit.
    required: false
    default: ./SKILL.md
  inventory-root:
    description: Repository path to scan when mode is inventory.
    required: false
    default: .
  fail-on-coverage:
    description: "Inventory coverage failure threshold: high, moderate, or none."
    required: false
    default: high
  policy:
    description: Built-in KelpClaw policy pack to apply; defaults by mode.
    required: false
    default: ""
  input:
    description: Optional JSON input file for the audit-first skill run.
    required: false
    default: ""
  fail-on-unrunnable:
    description: Fail the action when the compatibility report marks the skill as not runnable.
    required: false
    default: "true"
  upload-artifact:
    description: Upload the exported audit bundle as a workflow artifact.
    required: false
    default: "true"
  upload-sarif:
    description: Upload KelpClaw SARIF findings to GitHub code scanning.
    required: false
    default: "true"
  governance:
    description: Include an SG/APAC governance report in the audit bundle.
    required: false
    default: "false"
  region:
    description: Governance report region.
    required: false
    default: sg
  framework:
    description: Governance report framework.
    required: false
    default: agentic-ai

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build KelpClaw CLI
      shell: bash
      run: pnpm --filter @kelpclaw/cli build
    - name: Audit skill
      id: audit
      shell: bash
      run: |
        mkdir -p .kelpclaw
        POLICY_INPUT="${{ inputs.policy }}"
        if [ -z "$POLICY_INPUT" ]; then
          if [ "${{ inputs.mode }}" = "appsec" ]; then
            POLICY_INPUT="appsec-agent-baseline"
          else
            POLICY_INPUT="sg-agentic-ai-baseline"
          fi
        fi
        export KELPCLAW_ACTION_POLICY="$POLICY_INPUT"
        if [ "${{ inputs.mode }}" = "appsec" ]; then
          if [ -z "${{ inputs.agent-command }}" ]; then
            echo "::error title=KelpClaw AppSec::mode=appsec requires agent-command."
            exit 1
          fi
          APPSEC_OUT=".kelpclaw/appsec-action"
          APPSEC_ARGS=(appsec audit --context "${{ inputs.context }}" --dockerfile "${{ inputs.dockerfile }}" --agent-command "${{ inputs.agent-command }}" --policy "$POLICY_INPUT" --out "$APPSEC_OUT")
          if [ "${{ inputs.skip-docker-build }}" = "true" ]; then
            APPSEC_ARGS+=(--skip-docker-build)
          fi
          if [ "${{ inputs.lab-mode }}" = "true" ]; then
            APPSEC_ARGS+=(--lab-mode)
          fi
          if [ -n "${{ inputs.sarif }}" ]; then
            APPSEC_ARGS+=(--sarif "${{ inputs.sarif }}")
          fi
          if [ -n "${{ inputs.nuclei-jsonl }}" ]; then
            APPSEC_ARGS+=(--nuclei-jsonl "${{ inputs.nuclei-jsonl }}")
          fi
          if [ -n "${{ inputs.zap-json }}" ]; then
            APPSEC_ARGS+=(--zap-json "${{ inputs.zap-json }}")
          fi
          if [ -n "${{ inputs.nmap-xml }}" ]; then
            APPSEC_ARGS+=(--nmap-xml "${{ inputs.nmap-xml }}")
          fi
          if [ -n "${{ inputs.burp-xml }}" ]; then
            APPSEC_ARGS+=(--burp-xml "${{ inputs.burp-xml }}")
          fi
          if [ -n "${{ inputs.nessus-xml }}" ]; then
            APPSEC_ARGS+=(--nessus-xml "${{ inputs.nessus-xml }}")
          fi
          set +e
          node packages/cli/dist/index.js "${APPSEC_ARGS[@]}" > .kelpclaw/appsec-output.json
          APPSEC_EXIT=$?
          set -e
          cat .kelpclaw/appsec-output.json
          RUN_ID="$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync(".kelpclaw/appsec-output.json", "utf8")).runId);')"
          BUNDLE_PATH="$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync(".kelpclaw/appsec-output.json", "utf8")).bundleDir);')"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "bundle-path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact-path=$APPSEC_OUT" >> "$GITHUB_OUTPUT"
          echo "sarif-path=$APPSEC_OUT/findings.sarif" >> "$GITHUB_OUTPUT"
          node packages/cli/dist/index.js verify-audit-bundle "$BUNDLE_PATH" > .kelpclaw/appsec-bundle-verify.json
          set +e
          node packages/cli/dist/index.js evidence qa --workspace "$APPSEC_OUT/evidence-workspace" > .kelpclaw/appsec-qa.json
          QA_EXIT=$?
          set -e
          cat .kelpclaw/appsec-qa.json
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(".kelpclaw/appsec-output.json", "utf8"));
          const run = JSON.parse(fs.readFileSync(`${result.outDir}/appsec-run.json`, "utf8"));
          const verify = JSON.parse(fs.readFileSync(".kelpclaw/appsec-bundle-verify.json", "utf8"));
          const qa = JSON.parse(fs.readFileSync(".kelpclaw/appsec-qa.json", "utf8"));
          const imports = run.scannerImports || [];
          const triageFindings = Array.isArray(run.triage?.triageFindings) ? run.triage.triageFindings : [];
          const correlated = triageFindings.filter((finding) => Array.isArray(finding.evidenceIds) && finding.evidenceIds.length > 0).length;
          console.log("## KelpClaw AppSec Audit");
          console.log("");
          console.log(`- Run ID: \`${result.runId}\``);
          console.log(`- Policy: \`${process.env.KELPCLAW_ACTION_POLICY}\``);
          console.log(`- Status: \`${result.status}\``);
          console.log(`- Bundle: \`${result.bundleDir}\``);
          console.log(`- Imported findings: \`${result.importedFindings}\``);
          console.log(`- Scanner imports: \`${imports.map((entry) => `${entry.metadata?.format || entry.rawPath}:${entry.importedFindings}`).join(", ") || "none"}\``);
          console.log(`- Docker built: \`${result.docker.built}\``);
          console.log(`- Agent ran: \`${result.agent.ran}\``);
          console.log(`- Evidence QA: \`${qa.valid ? "valid" : "invalid"} (${qa.errorCount} errors, ${qa.warningCount} warnings)\``);
          console.log(`- Correlated triage findings: \`${correlated}/${triageFindings.length}\``);
          console.log(`- Bundle signature: \`${verify.signature.valid ? "valid" : "invalid"}\``);
          NODE
          if [ "$APPSEC_EXIT" -ne 0 ]; then
            exit "$APPSEC_EXIT"
          fi
          if [ "${{ inputs.fail-on-qa }}" = "true" ] && [ "$QA_EXIT" -ne 0 ]; then
            exit "$QA_EXIT"
          fi
          exit "$APPSEC_EXIT"
        fi

        if [ "${{ inputs.mode }}" = "inventory" ]; then
          mkdir -p .kelpclaw/inventory-output
          node packages/cli/dist/index.js inventory scan --root "${{ inputs.inventory-root }}" --policy "$POLICY_INPUT" --out .kelpclaw/inventory-output/agent-inventory.json > .kelpclaw/inventory-output/scan-output.json
          node packages/cli/dist/index.js inventory graph --root "${{ inputs.inventory-root }}" --policy "$POLICY_INPUT" --format markdown --out .kelpclaw/inventory-output/permissions.md > .kelpclaw/inventory-output/graph-output.json
          set +e
          node packages/cli/dist/index.js inventory coverage --root "${{ inputs.inventory-root }}" --policy "$POLICY_INPUT" --format markdown --out .kelpclaw/inventory-output/coverage.md --fail-on "${{ inputs.fail-on-coverage }}" > .kelpclaw/inventory-output/coverage-output.json
          COVERAGE_EXIT=$?
          set -e
          echo "run-id=inventory" >> "$GITHUB_OUTPUT"
          echo "artifact-path=.kelpclaw/inventory-output" >> "$GITHUB_OUTPUT"
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const inventory = JSON.parse(fs.readFileSync(".kelpclaw/inventory-output/agent-inventory.json", "utf8"));
          const coverage = JSON.parse(fs.readFileSync(".kelpclaw/inventory-output/coverage-output.json", "utf8"));
          console.log("## KelpClaw Agent Inventory");
          console.log("");
          console.log(`- Root: \`${inventory.root}\``);
          console.log(`- Policy: \`${inventory.policyPack}\``);
          console.log(`- Skills: \`${inventory.skills.length}\``);
          console.log(`- Runs: \`${inventory.runs.length}\``);
          console.log(`- Bundles: \`${inventory.bundles.length}\``);
          console.log(`- Web evidence: \`${inventory.webEvidence.length}\``);
          console.log(`- Evidence workspaces: \`${inventory.evidenceWorkspaces.length}\``);
          console.log(`- Findings: \`${coverage.findingCount}\` (${coverage.summary.high} high, ${coverage.summary.moderate} moderate, ${coverage.summary.info} info)`);
          console.log("");
          console.log("| Severity | Category | Finding | Evidence |");
          console.log("| --- | --- | --- | --- |");
          for (const finding of (coverage.findings || []).slice(0, 12)) {
            console.log(`| ${finding.severity} | ${finding.category} | ${finding.title} | ${finding.evidence} |`);
          }
          NODE
          exit "$COVERAGE_EXIT"
        fi

        INPUT_PATH="${{ inputs.input }}"
        if [ -z "$INPUT_PATH" ]; then
          INPUT_PATH=".kelpclaw/action-input.json"
          printf '{}\n' > "$INPUT_PATH"
        fi

        node packages/cli/dist/index.js compat "${{ inputs.skill }}" --policy "$POLICY_INPUT" > .kelpclaw/compatibility.json
        node packages/cli/dist/index.js export-sarif "${{ inputs.skill }}" --policy "$POLICY_INPUT" --out .kelpclaw/findings.sarif > .kelpclaw/sarif-output.json
        echo "sarif-path=.kelpclaw/findings.sarif" >> "$GITHUB_OUTPUT"
        cat .kelpclaw/compatibility.json
        node <<'NODE'
        const fs = require("node:fs");
        const report = JSON.parse(fs.readFileSync(".kelpclaw/compatibility.json", "utf8"));
        const failOnUnrunnable = "${{ inputs.fail-on-unrunnable }}" === "true";
        for (const finding of report.policyFindings || []) {
          const level = finding.action === "deny" ? "error" : "warning";
          const title = encodeURIComponent(`KelpClaw ${finding.action}: ${finding.tool}`);
          const message = encodeURIComponent(`${finding.reason}; rules=${(finding.matchedRuleIds || []).join(",")}`);
          console.log(`::${level} title=${title}::${message}`);
        }
        if (!report.runnable && failOnUnrunnable) {
          console.log("::error title=KelpClaw compatibility::Skill is not runnable under the selected policy.");
          process.exit(1);
        }
        NODE
        set +e
        RUN_OUTPUT="$(node packages/cli/dist/index.js run-skill "${{ inputs.skill }}" --input "$INPUT_PATH" --policy "$POLICY_INPUT" 2> .kelpclaw/run-error.log)"
        RUN_EXIT=$?
        set -e
        if [ -s .kelpclaw/run-error.log ]; then
          cat .kelpclaw/run-error.log
        fi
        if [ "$RUN_EXIT" -ne 0 ]; then
          if node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(".kelpclaw/compatibility.json", "utf8")); const failOnUnrunnable = "${{ inputs.fail-on-unrunnable }}" === "true"; process.exit(report.runnable || failOnUnrunnable ? 0 : 1);'; then
            exit "$RUN_EXIT"
          fi
        fi
        printf '%s\n' "$RUN_OUTPUT"
        printf '%s\n' "$RUN_OUTPUT" > .kelpclaw/run-output.json
        RUN_ID="$(printf '%s\n' "$RUN_OUTPUT" | node -e 'let input=""; process.stdin.on("data", c => input += c); process.stdin.on("end", () => console.log(JSON.parse(input).runId));')"
        EXPORT_ARGS=(export-audit-bundle "$RUN_ID" --out ".kelpclaw/audit-bundle-$RUN_ID" --include-sarif --include-controls)
        if [ "${{ inputs.governance }}" = "true" ]; then
          EXPORT_ARGS+=(--include-governance --region "${{ inputs.region }}" --framework "${{ inputs.framework }}")
        fi
        node packages/cli/dist/index.js "${EXPORT_ARGS[@]}" > .kelpclaw/bundle-output.json
        cp ".kelpclaw/audit-bundle-$RUN_ID/findings.sarif" .kelpclaw/findings.sarif
        node packages/cli/dist/index.js verify-audit-bundle ".kelpclaw/audit-bundle-$RUN_ID" --strict > .kelpclaw/bundle-verify.json
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "bundle-path=.kelpclaw/audit-bundle-$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "artifact-path=.kelpclaw/audit-bundle-$RUN_ID" >> "$GITHUB_OUTPUT"
        node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
        const fs = require("node:fs");
        const compat = JSON.parse(fs.readFileSync(".kelpclaw/compatibility.json", "utf8"));
        const run = JSON.parse(fs.readFileSync(".kelpclaw/run-output.json", "utf8"));
        const bundle = JSON.parse(fs.readFileSync(".kelpclaw/bundle-output.json", "utf8"));
        const verify = JSON.parse(fs.readFileSync(".kelpclaw/bundle-verify.json", "utf8"));
        const governancePath = `${bundle.bundleDir}/governance-report.json`;
        const controlsPath = `${bundle.bundleDir}/controls.md`;
        const sarifPath = `${bundle.bundleDir}/findings.sarif`;
        const governance = fs.existsSync(governancePath) ? JSON.parse(fs.readFileSync(governancePath, "utf8")) : undefined;
        const sarif = fs.existsSync(sarifPath) ? JSON.parse(fs.readFileSync(sarifPath, "utf8")) : undefined;
        const results = sarif?.runs?.[0]?.results || [];
        for (const result of results) {
          const level = result.level === "error" ? "error" : result.level === "warning" ? "warning" : "notice";
          const title = encodeURIComponent(result.properties?.title || result.ruleId || "KelpClaw finding");
          const message = encodeURIComponent(result.message?.text || "KelpClaw finding");
          console.error(`::${level} title=${title}::${message}`);
        }
        console.log("## KelpClaw Skill Audit");
        console.log("");
        console.log(`- Skill: \`${"${{ inputs.skill }}"}\``);
        console.log(`- Policy: \`${process.env.KELPCLAW_ACTION_POLICY}\``);
        console.log(`- Runnable: \`${compat.runnable}\``);
        console.log(`- Run ID: \`${run.runId}\``);
        console.log(`- Status: \`${run.status}\``);
        console.log(`- Bundle: \`${bundle.bundleDir}\``);
        console.log(`- Bundle signature: \`${verify.signature.valid ? "valid" : "invalid"}\``);
        console.log(`- Bundle attestation: \`${verify.attestation?.valid ? "valid" : "invalid"}\``);
        console.log(`- SARIF findings: \`${results.length}\``);
        console.log(`- Controls matrix: \`${fs.existsSync(controlsPath) ? controlsPath : "not generated"}\``);
        if (governance) {
          console.log(`- Governance tier: \`${governance.autonomyTier}\``);
          console.log(`- Governance findings: \`${(governance.findings || []).length}\``);
          console.log("");
          console.log("| Control Area | Status | Evidence |");
          console.log("| --- | --- | --- |");
          for (const mapping of governance.frameworkMapping || []) {
            console.log(`| ${mapping.controlArea} | ${mapping.status} | ${(mapping.evidence || []).join("<br>")} |`);
          }
        }
        console.log(`- Tools: \`${(compat.toolsDetected || []).join(", ") || "none"}\``);
        console.log(`- Network: \`${compat.network}\``);
        console.log(`- Sandbox: \`${compat.sandboxProfile}\``);
        if ((compat.policyFindings || []).length > 0) {
          console.log("");
          console.log("| Action | Tool | Rules | Reason |");
          console.log("| --- | --- | --- | --- |");
          for (const finding of compat.policyFindings) {
            console.log(`| ${finding.action} | ${finding.tool} | ${(finding.matchedRuleIds || []).join(", ")} | ${finding.reason} |`);
          }
        }
        NODE
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.audit.outputs.sarif-path != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.audit.outputs.sarif-path }}
    - name: Upload KelpClaw artifact
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.audit.outputs.artifact-path != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: kelpclaw-${{ inputs.mode }}-${{ steps.audit.outputs.run-id }}
        path: ${{ steps.audit.outputs.artifact-path }}
