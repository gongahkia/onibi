id = "helix-page-down-adapter"
editor = "helix"
outcome = "partial"
source = "https://docs.helix-editor.com/master/keymap.html"
boundary = "The supplied Helix-style adapter can request model-neutral page movement for the focused selection-first view."
limitations = ["picker/config discovery, native `+`/`*` register grammar and multi-selection clipboard behavior, Helix selected-register macro workflow, Helix regex and exact post-rotation selection semantics, shell command-line/pipes, general workspace edits, full window model, and theme parity"]
model = "selection"
adapter = "examples/helix-adapter.lua"
contents = "zero\none\ntwo\nthree\nfour\nfive\nsix\nseven"
inputs = ["PageDown"]
columns = 20
rows = 5

[expect]
contents = "zero\none\ntwo\nthree\nfour\nfive\nsix\nseven"
selections = ["0:0"]
primary_selection = 0
viewport_top_line = 4
pane_count = 1
status = "select"
trace = ["binding:view.page.down"]
provenance = []
