id = "kakoune-ordered-multiple-selection"
editor = "kakoune"
outcome = "partial"
source = "https://github.com/mawww/kakoune/blob/master/doc/pages/keys.asciidoc"
boundary = "The selection-first model exposes ordered selections and applies one checked delete transaction to every current selection."
limitations = ["Kakoune's inclusive anchor/cursor model, exact regex/count grouping and post-rotation selection semantics, Kakoune register-selection macro grammar, native mark/jump-list grammar, client/server sessions, shell expansions and asynchronous socket integration, full command language, and face/highlighter ecosystem"]
