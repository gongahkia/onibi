[workspace]
members = [
  "crates/yeokcham-core",
  "crates/yeokcham-protocol",
  "crates/yeokcham-daemon",
  "crates/yeokcham-relay",
  "crates/yeokcham-ffi",
  "crates/yeokcham-cli",
  "crates/yeokcham-daemon-api",
  "crates/yeokcham-sdk",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/gongahkia/yeokcham"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "=0.29.0"
criterion = { version = "0.8.2", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "rand_core", "zeroize"] }
fs2 = "0.4.3"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
hkdf = { version = "=0.13.0", default-features = false }
igd-next = { version = "0.17.1", default-features = false, features = ["aio_tokio"] }
keyring-core = "1.0.0"
minicbor = { version = "2.2.2", features = ["std"] }
mdns-sd = { version = "0.20.1", default-features = false }
natpmp = "0.5.0"
prost = "=0.14.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
proptest = "1.11.0"
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.11.0", default-features = false }
stunclient = "0.4.2"
subtle = "=2.6.1"
tokio-socks = "0.5.3"
security-framework = { version = "3.7.0", default-features = false }
security-framework-sys = { version = "2.17.0", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
